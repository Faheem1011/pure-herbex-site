<!-- PROMO MODAL SCRIPT -->
<script>
(function() {
  function getModal() {
    let modal = document.getElementById('promo-import-modal');
    if (!modal) {
      modal = document.createElement('div');
      modal.id = 'promo-import-modal';
      modal.style.cssText = 'position:fixed;inset:0;z-index:9999999;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:16px;';
      modal.innerHTML = `
        <div style="background:#18181b;border:1px solid #27272a;border-radius:20px;width:100%;max-width:540px;padding:24px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.6);color:#fafafa;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
            <div>
              <h3 style="margin:0;font-size:18px;font-weight:700;color:#10b981;">Add Numbers to Promo Section</h3>
              <p style="margin:4px 0 0;font-size:12px;color:#a1a1aa;">Add 200+ numbers to send WhatsApp marketing templates in 1 click</p>
            </div>
            <button id="promo-modal-close-x" style="background:none;border:none;color:#a1a1aa;font-size:24px;cursor:pointer;padding:4px 8px;border-radius:8px;line-height:1;">&times;</button>
          </div>

          <div style="margin-bottom:14px;">
            <label style="display:block;font-size:12px;font-weight:600;color:#d4d4d8;margin-bottom:6px;">
              Paste Phone Numbers (one per line, comma or space separated)
            </label>
            <textarea id="promo-numbers-input" rows="8" placeholder="Paste 200+ numbers here...&#10;Examples:&#10;923001234567&#10;923160924151, Tariq, Okara&#10;03001234567, Asad, Lahore&#10;03211234567" style="width:100%;box-sizing:border-box;background:#09090b;border:1px solid #3f3f46;border-radius:12px;color:#f4f4f5;padding:12px;font-size:13px;font-family:monospace;resize:vertical;outline:none;"></textarea>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:11px;color:#a1a1aa;">
              <span id="promo-detected-count">0 numbers detected</span>
              <label style="cursor:pointer;color:#10b981;font-weight:600;display:flex;align-items:center;gap:4px;">
                📁 Upload CSV / TXT
                <input type="file" id="promo-file-input" accept=".csv,.txt" style="display:none;" />
              </label>
            </div>
          </div>

          <div id="promo-import-status" style="display:none;padding:10px 14px;border-radius:10px;font-size:12px;margin-bottom:12px;"></div>

          <div style="display:flex;gap:10px;margin-top:16px;">
            <button id="promo-modal-cancel-btn" style="flex:1;padding:12px;background:#27272a;border:1px solid #3f3f46;color:#e4e4e7;border-radius:12px;font-size:13px;font-weight:600;cursor:pointer;">Cancel</button>
            <button id="promo-save-btn" style="flex:2;padding:12px;background:#10b981;border:none;color:#09090b;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;">Save & Add to Promo List</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);

      const closeBtn = document.getElementById('promo-modal-close-x');
      const cancelBtn = document.getElementById('promo-modal-cancel-btn');
      const fileInput = document.getElementById('promo-file-input');
      const ta = document.getElementById('promo-numbers-input');
      const saveBtn = document.getElementById('promo-save-btn');
      const badge = document.getElementById('promo-detected-count');

      function hide() {
        modal.style.display = 'none';
      }

      closeBtn.onclick = hide;
      cancelBtn.onclick = hide;
      modal.onclick = function(e) {
        if (e.target === modal) hide();
      };

      function updateCount() {
        const text = ta.value || '';
        const matches = text.match(/(\+?\d[\d\s\-\(\)]{8,15}\d)/g) || [];
        badge.textContent = matches.length + ' numbers detected';
        badge.style.color = matches.length >= 200 ? '#10b981' : (matches.length > 0 ? '#38bdf8' : '#a1a1aa');
      }

      ta.oninput = updateCount;

      fileInput.onchange = function(e) {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(evt) {
          ta.value = (ta.value ? ta.value + '\n' : '') + evt.target.result;
          updateCount();
        };
        reader.readAsText(file);
      };

      saveBtn.onclick = async function() {
        const raw = ta.value.trim();
        const status = document.getElementById('promo-import-status');
        if (!raw) {
          status.style.display = 'block';
          status.style.background = 'rgba(244,63,94,0.15)';
          status.style.color = '#fb7185';
          status.style.border = '1px solid rgba(244,63,94,0.3)';
          status.textContent = 'Please enter or paste at least one phone number.';
          return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving to Database...';
        status.style.display = 'none';

        try {
          const token = localStorage.getItem('inbox_password') || 'Mushtaq2026!';
          const res = await fetch('/api/campaign/', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + token,
            },
            body: JSON.stringify({ addLeads: true, numbers: raw }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || 'Failed to save numbers');

          status.style.display = 'block';
          status.style.background = 'rgba(16,185,129,0.15)';
          status.style.color = '#34d399';
          status.style.border = '1px solid rgba(16,185,129,0.3)';
          status.textContent = '✓ ' + (data.message || ('Added ' + data.addedCount + ' numbers successfully!'));

          if (typeof window.setPromoLeads === 'function' && Array.isArray(data.leads)) {
            window.setPromoLeads(data.leads);
          }
          if (typeof window.setCampaignStatus === 'function' && data.status && typeof data.status === 'object') {
            window.setCampaignStatus(data.status);
          }
          if (typeof window.refreshCampaignLeads === 'function') {
            window.refreshCampaignLeads();
          }

          setTimeout(function() {
            hide();
            ta.value = '';
            updateCount();
            status.style.display = 'none';
            saveBtn.disabled = false;
            saveBtn.textContent = 'Save & Add to Promo List';
          }, 1200);
        } catch (err) {
          status.style.display = 'block';
          status.style.background = 'rgba(244,63,94,0.15)';
          status.style.color = '#fb7185';
          status.style.border = '1px solid rgba(244,63,94,0.3)';
          status.textContent = 'Error: ' + err.message;
          saveBtn.disabled = false;
          saveBtn.textContent = 'Save & Add to Promo List';
        }
      };
    }
    return modal;
  }

  window.openPromoImportModal = function() {
    const modal = getModal();
    modal.style.display = 'flex';
    const ta = document.getElementById('promo-numbers-input');
    if (ta) ta.focus();
  };

  // Global click delegate: works even if React re-rendered the button!
  document.addEventListener('click', function(e) {
    const btn = e.target && e.target.closest('button');
    if (btn && btn.textContent && (btn.textContent.includes('Add Numbers') || btn.textContent.includes('Import Leads'))) {
      e.preventDefault();
      e.stopPropagation();
      window.openPromoImportModal();
    }
  }, true);
})();
</script>
